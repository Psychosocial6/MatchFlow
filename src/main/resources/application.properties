spring.application.name=matchflow
server.port=80
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.separator=;;
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
matchflow.auth.jwt-secret=${AUTH_JWT_SECRET:}
matchflow.auth.jwt-issuer=${AUTH_JWT_ISSUER:matchflow}
matchflow.auth.jwt-ttl=${AUTH_JWT_TTL:1h}
matchflow.auth.jwt-algorithm=${AUTH_JWT_ALGORITHM:HS256}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

matchflow.email.from=${SMTP_FROM:no-reply@matchflow.test}
matchflow.email.verification-url=${EMAIL_VERIFICATION_URL:http://localhost:${server.port}/api/auth/verify-email}
matchflow.email.token-ttl=${EMAIL_TOKEN_TTL:30m}
matchflow.email.resend-interval=${EMAIL_RESEND_INTERVAL:1m}

matchflow.vk.client-id=${VK_CLIENT_ID:}
matchflow.vk.redirect-uri=${VK_REDIRECT_URI:http://localhost}
matchflow.vk.service-token=${VK_SERVICE_TOKEN:}
server.servlet.session.cookie.same-site=lax
